<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bass Analyzer</title>

<!-- PWA / iOS "Add to Home Screen" -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bass Analyzer">
<meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d10;
  --panel: #141418;
  --panel-2: #1a1a26;
  --border: #252530;
  --bass: #00e5ff;
  --guitar: #ff4d4d;
  --kick: #ffaa00;
  --snare: #c084fc;
  --hh: #86efac;
  --text: #dde0ea;
  --dim: #555568;
  --pedal-edge: #2e2e3c;
  --darkgas-teal: #00c8b4;
  --glow: rgba(0,200,180,0.35);
  --island: rgba(14,14,20,0.94);
  color-scheme: dark;
}
/* ── LIGHT THEME ── */
:root[data-theme="light"] {
  --bg: #eef0f5;
  --panel: #ffffff;
  --panel-2: #f1f2f7;
  --border: #d4d7e0;
  --bass: #0096c8;
  --guitar: #e02d2d;
  --kick: #d98200;
  --snare: #8a3fce;
  --hh: #2f9e57;
  --text: #1d2030;
  --dim: #6c7088;
  --pedal-edge: #c4c8d6;
  --darkgas-teal: #009a8a;
  --glow: rgba(0,154,138,0.30);
  --island: rgba(255,255,255,0.94);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
           24px calc(20px + env(safe-area-inset-left));
  /* JS sets the real bottom padding to the measured island height. This is the
     pre-measurement fallback so a slow first paint never hides content. */
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  transition: background-color 0.25s, color 0.25s;
  background-image:
    radial-gradient(ellipse 70% 50% at 15% 5%, rgba(0,200,180,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 95%, rgba(0,229,255,0.04) 0%, transparent 60%);
}
.app-wrap { max-width: 600px; margin: 0 auto; }

header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2rem, 5vw, 3.4rem);
  letter-spacing: 0.08em; line-height: 1;
}
header h1 em { color: var(--darkgas-teal); font-style: normal; }
header p { font-size: 0.67rem; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 5px; }

/* ── TAB ISLAND ── */
.tab-island {
  position: fixed; z-index: 90;
  left: 50%; transform: translateX(-50%);
  bottom: calc(10px + env(safe-area-inset-bottom));
  width: min(560px, calc(100vw - 24px));
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px;
  padding: 5px;
  background: var(--island);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 6px 26px rgba(0,0,0,0.42);
}
.tab-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.56rem; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 9px 1px 8px; border-radius: 8px;
  border: 1px solid transparent; background: none;
  color: var(--dim); cursor: pointer; transition: all 0.14s;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-height: 46px;
}
.tab-btn .tab-ico { font-size: 0.95rem; line-height: 1; }
.tab-btn[aria-selected="true"] {
  background: var(--darkgas-teal); color: #04120f;
  border-color: var(--darkgas-teal);
  box-shadow: 0 0 14px var(--glow);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 16px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.sw { width: 22px; height: 2.5px; border-radius: 2px; }
.sw.bass   { background: var(--bass);   box-shadow: 0 0 6px var(--bass); }
.sw.guitar { background: var(--guitar); box-shadow: 0 0 6px var(--guitar); }
.sw.kick   { background: var(--kick);   box-shadow: 0 0 6px var(--kick); }
.sw.snare  { background: var(--snare);  box-shadow: 0 0 6px var(--snare); }
.sw.hh     { background: var(--hh);     box-shadow: 0 0 6px var(--hh); }
.sw.bassflat { background: rgba(0,229,255,0.35); }

.section-label {
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--dim); margin-bottom: 6px; margin-top: 18px;
  border-left: 2px solid var(--border); padding-left: 8px;
}
.section-label span { color: var(--darkgas-teal); }

.chart-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 0 0;
  margin-bottom: 8px;
  overflow: hidden;
}
canvas { display: block; width: 100% !important; }

.ann-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}
.ann {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  background: var(--panel);
  font-size: 0.63rem;
  line-height: 1.6;
  color: #7878a0;
}
.ann strong { display: block; font-size: 0.68rem; color: var(--text); margin-bottom: 2px; letter-spacing: 0.06em; }
.ann em { color: var(--darkgas-teal); font-style: normal; }
.ann.bl { border-left: 3px solid var(--bass); }
.ann.gl { border-left: 3px solid var(--guitar); }
.ann.kl { border-left: 3px solid var(--kick); }
.ann.ol { border-left: 3px solid #ff8c42; }

/* Pedal panel — knobs and switches, ported from the printed preset sheet.
   Everything is a theme variable, so the panel is correct in both themes. */
.pedal-panel {
  width: 100%; max-width: 560px; margin: 0 auto;
  border: 1px solid var(--pedal-edge); border-radius: 10px;
  background: var(--panel); padding: 16px 12px 10px;
  display: flex; flex-direction: column; gap: 18px;
}
.pedal-row.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 4px; }
.pedal-row.grid4 { display: grid; grid-template-columns: repeat(4, 1fr);
                   justify-items: center; align-items: start; gap: 10px 4px; }
.pedal-caption { text-align: center; font-size: 0.5rem; letter-spacing: 0.2em;
                 text-transform: uppercase; color: var(--dim); }

.knobcell { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.knob-label { font-size: 0.55rem; letter-spacing: 0.07em; font-weight: 600;
              text-transform: uppercase; color: var(--text); white-space: nowrap; }
.knob { width: 52px; height: 52px; border-radius: 50%; flex: none; position: relative;
        border: 1px solid var(--pedal-edge); background: var(--panel-2);
        cursor: grab; touch-action: pan-y; }   /* pan-y: a thumb crossing a knob
        must still scroll the page — the knob claims horizontal drags only */
.knob:active { cursor: grabbing; }
.knob:focus-visible { outline: 2px solid var(--darkgas-teal); outline-offset: 2px; }
.knob-ptr { position: absolute; left: calc(50% - 1px); bottom: 50%; width: 2px; height: 40%;
            background: var(--darkgas-teal); border-radius: 1px;
            transform-origin: bottom center; transform: rotate(var(--deg, 0deg)); }
.knob-hub { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px;
            background: var(--dim); border-radius: 50%; transform: translate(-50%, -50%); }
.knob-read .val { color: var(--darkgas-teal); font-size: 0.58rem; }
.knob-clock { font-size: 0.55rem; font-weight: 700; font-variant-numeric: tabular-nums;
              color: var(--dim); }
.knobcell.dimmed { opacity: 0.38; }
.knob[aria-disabled="true"] { cursor: not-allowed; }

.swcell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.sw-main { display: flex; gap: 6px; align-items: stretch; }
.sw-pill { width: 20px; flex: none; position: relative; cursor: pointer;
           border: 1px solid var(--pedal-edge); border-radius: 11px; background: var(--panel-2); }
.sw-pill.n3 { height: 52px; }
.sw-pill.n2 { height: 34px; }
.sw-pill:focus-visible { outline: 2px solid var(--darkgas-teal); outline-offset: 2px; }
.sw-dot { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; border-radius: 50%;
          background: var(--darkgas-teal); transform: translate(-50%, -50%); transition: top 0.1s ease; }
.sw-labels { display: flex; flex-direction: column; justify-content: space-between; padding: 1px 0; }
.sw-labels span { font-size: 0.5rem; line-height: 1; font-weight: 700; white-space: nowrap;
                  color: var(--dim); }
.sw-labels span.on { color: var(--text); }
.sw-cap { font-size: 0.52rem; letter-spacing: 0.09em; font-weight: 600;
          text-transform: uppercase; color: var(--dim); }
.sw-read .val { color: var(--darkgas-teal); font-size: 0.55rem; }

.controls-grid {
  width: 100%; max-width: 560px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.ctrl-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 11px 13px;
  transition: opacity 0.18s;
}
.ctrl-card.dimmed { opacity: 0.38; }
.ctrl-label {
  font-size: 0.61rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dim); margin-bottom: 5px;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.ctrl-label span.val { color: var(--darkgas-teal); font-size: 0.7rem; }
.ctrl-sub { font-size: 0.57rem; color: #4a4a63; letter-spacing: 0.1em; margin-bottom: 4px; }

input[type=range] {
  width: 100%; accent-color: var(--darkgas-teal);
  height: 4px; cursor: pointer;
}
.freq-btns { display: flex; gap: 5px; margin-top: 5px; }
.freq-btn {
  flex: 1; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 3px;
  color: var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 0.66rem; letter-spacing: 0.06em;
  padding: 4px 0; cursor: pointer; transition: all 0.12s;
}
.freq-btn.active { background: var(--darkgas-teal); color: #000; border-color: var(--darkgas-teal); }
.range-labels { display: flex; justify-content: space-between; font-size: 0.58rem; color: #4a4a63; margin-top: 3px; }

/* 3-position switches (Grunt / Attack) */
.sw3 { display: flex; gap: 4px; margin-top: 5px; }
.sw3 button {
  flex: 1; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 3px;
  color: var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 0.64rem; letter-spacing: 0.06em;
  padding: 5px 0; cursor: pointer; transition: all 0.12s;
}
.sw3 button.active { background: var(--darkgas-teal); color: #000; border-color: var(--darkgas-teal); }

footer { font-size: 0.59rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 16px; line-height: 1.7; }

/* ── TOOLTIPS ── */
.tip-btn {
  flex-shrink: 0;
  width: 15px; height: 15px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem; line-height: 1; cursor: help;
  display: inline-flex; align-items: center; justify-content: center;
  position: relative; padding: 0;
}
.tip-bub {
  position: absolute; bottom: calc(100% + 7px); right: -4px;
  width: 216px; padding: 8px 10px;
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--darkgas-teal); border-radius: 5px;
  font-size: 0.6rem; line-height: 1.55; letter-spacing: 0.02em;
  text-transform: none; text-align: left;
  /* The knob labels are nowrap; without this the bubble inherits it and
     renders as one long line, which also pushed the document 463 px wide. */
  white-space: normal;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  opacity: 0; visibility: hidden; transition: opacity 0.13s;
  z-index: 60; pointer-events: none;
}
.tip-btn.open .tip-bub { opacity: 1; visibility: visible; }
@media (hover: hover) and (pointer: fine) {
  .tip-btn:hover .tip-bub, .tip-btn:focus-visible .tip-bub { opacity: 1; visibility: visible; }
}

/* ── AUDIO ENGINE BAR ── */
.audio-bar {
  width: 100%; max-width: 560px;
  margin: 0 auto 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.audio-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.audio-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 7px 16px; border-radius: 4px; border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s;
  background: var(--panel-2); color: var(--dim); white-space: nowrap;
}
.audio-btn.active { background: var(--darkgas-teal); color: #000; border-color: var(--darkgas-teal); box-shadow: 0 0 12px rgba(0,200,180,0.35); }
.audio-btn.bypass-on { background: #ff4d4d22; color: #ff6666; border-color: #ff4d4d55; }
.audio-status { font-size: 0.62rem; letter-spacing: 0.1em; color: var(--dim); flex: 1; }
.audio-status em { color: var(--darkgas-teal); font-style: normal; }
.audio-status.err { color: #ff6666; }
.audio-status .lat-raw { display: block; margin-top: 2px; opacity: 0.6; font-size: 0.92em; letter-spacing: 0.05em; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meter-wrap { display: flex; flex-direction: column; gap: 3px; }
.meter-label { font-size: 0.58rem; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
.meter-track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.meter-fill { height: 100%; border-radius: 3px; width: 0%; transition: width 0.05s linear; background: linear-gradient(90deg, #00c8b4 0%, #00e5ff 60%, #ff4d4d 100%); }
.trim-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.trim-item { display: flex; flex-direction: column; gap: 3px; }
.trim-label { font-size: 0.58rem; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; }
.trim-label span { color: var(--darkgas-teal); }
.device-row { display: flex; flex-direction: column; gap: 3px; }
.device-row label { font-size: 0.58rem; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
select#deviceSelect {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 3px; color: var(--text); font-family: 'Share Tech Mono', monospace;
  font-size: 0.68rem; padding: 5px 8px; cursor: pointer;
  appearance: none; -webkit-appearance: none;
}

/* ── MODAL ── */
.modal-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.82); z-index: 100;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-backdrop.open { display: flex; }
.modal-box {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px 20px 16px;
  width: min(700px, 96vw); max-height: 92vh;
  overflow-y: auto; position: relative;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.12em; color: var(--text); }
.modal-title em { color: var(--darkgas-teal); font-style: normal; }
.modal-close {
  background: none; border: 1px solid var(--border);
  color: var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.1em; padding: 5px 12px;
  border-radius: 3px; cursor: pointer; transition: all 0.12s;
}
.modal-close:hover { color: var(--text); border-color: var(--text); }

/* ── SCOPE (behind a disclosure) ── */
.disclosure {
  width: 100%; max-width: 560px; margin: 0 auto 8px;
  display: flex; align-items: center; gap: 8px;
}
.disclosure-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.63rem; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--dim); cursor: pointer; transition: all 0.12s;
}
.disclosure-btn.open { color: var(--darkgas-teal); border-color: var(--darkgas-teal); }
.scope-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden; margin-bottom: 8px;
  position: relative; display: none;
}
.scope-card.open { display: block; }
.scope-card canvas { display: block; width: 100% !important; }
.scope-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--panel-2);
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.scope-label { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
.scope-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.08em;
  padding: 3px 10px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--dim); cursor: pointer; transition: all 0.12s;
}
.scope-btn.active { background: var(--darkgas-teal); color: #000; border-color: var(--darkgas-teal); }
.scope-info { margin-left: auto; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--dim); white-space: nowrap; }
.scope-info em { color: var(--darkgas-teal); font-style: normal; }

/* ── CROSSHAIR TOOLTIP ── */
#freqTooltip {
  position: fixed; pointer-events: none;
  background: rgba(10,10,18,0.92); border: 1px solid var(--darkgas-teal);
  border-radius: 3px; padding: 4px 9px; font-size: 0.68rem;
  letter-spacing: 0.08em; color: var(--darkgas-teal);
  white-space: nowrap; z-index: 200;
  box-shadow: 0 0 10px rgba(0,200,180,0.25);
  display: none;
}

/* ── PRESETS ── */
.preset-section {
  width: 100%; max-width: 560px; margin: 0 auto 12px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 14px;
}
.preset-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.preset-title { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); flex: 1; }
.preset-save-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 14px; border-radius: 3px;
  border: 1px solid var(--darkgas-teal);
  background: rgba(0,200,180,0.08); color: var(--darkgas-teal);
  cursor: pointer; transition: all 0.12s;
}
.preset-save-btn:hover { background: rgba(0,200,180,0.18); }
.preset-name-input {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.68rem; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 3px;
  color: var(--text); padding: 4px 8px; width: 140px;
  letter-spacing: 0.06em;
}
.preset-name-input:focus { outline: none; border-color: var(--darkgas-teal); }
.preset-list { display: flex; flex-wrap: wrap; gap: 6px; }
.preset-chip {
  display: flex; align-items: center; gap: 0;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 3px; overflow: hidden;
  font-family: 'Share Tech Mono', monospace; font-size: 0.65rem;
}
.preset-load {
  padding: 5px 10px; cursor: pointer; color: var(--dim);
  background: none; border: none; font-family: inherit;
  font-size: inherit; letter-spacing: 0.06em; transition: all 0.12s;
}
.preset-load:hover { color: var(--darkgas-teal); background: rgba(0,200,180,0.08); }
.preset-del {
  padding: 5px 7px; cursor: pointer; color: #666;
  background: none; border: none; border-left: 1px solid var(--border);
  font-size: 0.7rem; transition: all 0.12s; line-height: 1;
}
.preset-del:hover { color: #ff4d4d; background: rgba(255,77,77,0.08); }
.preset-empty { font-size: 0.62rem; color: #4a4a63; letter-spacing: 0.1em; }

/* ── ANALYZER TOOLBAR ── */
.fft-toggle-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.fft-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 4px 12px; border-radius: 3px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--dim); cursor: pointer; transition: all 0.12s;
}
.fft-btn.active { background: #00aacc; color: #fff; border-color: #00aacc; }
.fft-info { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.1em; margin-left: 4px; }
.fft-info em { color: #00e5ff; font-style: normal; }
.frame-info {
  margin-left: auto; font-size: 0.58rem; letter-spacing: 0.08em;
  color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.frame-info em { color: var(--darkgas-teal); font-style: normal; }
.frame-info.hot em { color: #ff8c42; }

/* Analyzer slot: two canvases swapped into one fixed-height box */
/* 1px, not 0: zero-area sentinels are unreliable with IntersectionObserver,
   notably on iOS Safari where the toolbar resizes the scrollport. */
.sticky-sentinel { height: 1px; margin: 0; padding: 0; }
.analyzer-sticky { position: sticky; top: 0; z-index: 30; }
/* The wrapper keeps its full height in flow at all times (set from JS) so
   that sticking never changes the document height -- see
   reserveAnalyzerHeight(). Only the card inside shrinks, and the reserved
   space below it is pointer-transparent so content scrolling underneath
   stays clickable. */
.analyzer-sticky.stuck { pointer-events: none; }
.analyzer-sticky.stuck > .chart-card {
  pointer-events: auto;
  margin-bottom: 4px;
  box-shadow: 0 8px 16px -10px rgba(0, 0, 0, 0.75);
}
.analyzer-slot { position: relative; height: 220px; }
.analyzer-slot canvas { position: absolute; top: 0; left: 0; }
.analyzer-slot .layer { display: none; }
.analyzer-slot .layer.active { display: block; }
/* pan-y, not none: the browser keeps vertical scrolling (the analyzer is
   sticky and sits under the thumb), the probe only claims horizontal drags. */
#sgCrosshair { pointer-events: auto; cursor: crosshair; touch-action: pan-y; }
#fftCanvas { cursor: crosshair; touch-action: pan-y; }

/* Spectrogram scroll-speed selector */
.speed-wrap { display: flex; align-items: center; gap: 5px; }
.speed-label { font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.speed-sel { display: flex; gap: 3px; }
.speed-sel button {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
  color: var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.02em; padding: 3px 7px;
  cursor: pointer; transition: all 0.12s; min-width: 34px;
}
.speed-sel button.active { background: var(--darkgas-teal); color: #000; border-color: var(--darkgas-teal); }

/* ── DETUNE TAB ── */
.dt-card {
  width: 100%; max-width: 560px; margin: 0 auto 12px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 14px;
}
.dt-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.dt-readout { text-align: center; padding: 10px 0 6px; }
.dt-semis {
  font-family: 'Bebas Neue', sans-serif; font-size: 3.2rem; line-height: 0.95;
  color: var(--darkgas-teal); letter-spacing: 0.03em;
}
.dt-semis.zero { color: var(--dim); }
.dt-sub { font-size: 0.62rem; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; margin-top: 2px; }
.dt-ratio { font-size: 0.6rem; letter-spacing: 0.08em; color: var(--dim); margin-top: 5px; }
.dt-ratio em { color: var(--darkgas-teal); font-style: normal; }
.dt-strings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.dt-string {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 4px; text-align: center;
}
.dt-string .from { font-size: 0.56rem; color: var(--dim); letter-spacing: 0.06em; }
.dt-string .to   { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; color: var(--text); line-height: 1.1; }
.dt-string .hz   { font-size: 0.55rem; color: var(--dim); }
.dt-string.shifted .to { color: var(--darkgas-teal); }
.dt-mom {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 12px 18px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--dim); cursor: pointer; transition: all 0.08s;
  width: 100%; margin-top: 10px; touch-action: none; user-select: none;
}
.dt-mom.held { background: var(--darkgas-teal); color: #000; border-color: var(--darkgas-teal); box-shadow: 0 0 16px var(--glow); }
.dt-engine { font-size: 0.57rem; color: var(--dim); letter-spacing: 0.06em; line-height: 1.6; margin-top: 10px; }
.dt-engine em { color: var(--darkgas-teal); font-style: normal; }
.dt-engine.err { color: #ff8c42; }
.dt-preset-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.dt-preset-row button {
  flex: 1 1 auto; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 3px; color: var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem; padding: 5px 8px; cursor: pointer; transition: all 0.12s;
}
.dt-preset-row button.active { border-color: var(--darkgas-teal); color: var(--darkgas-teal); }

.ref-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 12px; border-radius: 3px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--dim); cursor: pointer;
  transition: all 0.12s; white-space: nowrap; margin-bottom: 8px;
}
.ref-btn:hover { color: var(--darkgas-teal); border-color: var(--darkgas-teal); }

.header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.theme-toggle {
  flex-shrink: 0;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.9rem; line-height: 1;
  width: 40px; height: 40px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.theme-toggle:hover { border-color: var(--darkgas-teal); color: var(--darkgas-teal); }

/* ── TUNER ── */
.tuner-section {
  width: 100%; max-width: 560px; margin: 0 auto 12px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 14px;
}
.tuner-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tuner-display { display: none; margin-top: 12px; }
.tuner-display.on { display: block; }
.tuner-readout { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin-bottom: 10px; }
.tuner-note {
  font-family: 'Bebas Neue', sans-serif; font-size: 3.6rem; line-height: 0.9;
  color: var(--text); letter-spacing: 0.04em; min-width: 1.6em; text-align: center;
}
.tuner-note.flat-of  { color: var(--bass); }
.tuner-note.in-tune  { color: var(--darkgas-teal); text-shadow: 0 0 14px var(--glow); }
.tuner-note.sharp-of { color: var(--guitar); }
.tuner-octave { font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; color: var(--dim); }
.tuner-cents  { font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; color: var(--dim); min-width: 5.5em; text-align: left; }
.tuner-cents em { font-style: normal; color: var(--darkgas-teal); }
.tuner-hz { font-size: 0.62rem; letter-spacing: 0.1em; color: var(--dim); text-align: center; margin-top: 8px; }
.tuner-meter {
  position: relative; height: 30px; border-radius: 5px;
  background: var(--panel-2); border: 1px solid var(--border); overflow: hidden;
}
.tuner-center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--darkgas-teal); transform: translateX(-1px); opacity: 0.6; }
.tuner-tick { position: absolute; top: 6px; bottom: 6px; width: 1px; background: var(--border); }
.tuner-needle {
  position: absolute; top: 3px; bottom: 3px; width: 4px; border-radius: 2px;
  background: var(--text); left: 50%; transform: translateX(-2px);
  transition: left 0.08s linear, background-color 0.1s;
}
.tuner-needle.in-tune { background: var(--darkgas-teal); box-shadow: 0 0 10px var(--glow); }
.tuner-labels { display: flex; justify-content: space-between; font-size: 0.55rem; color: var(--dim); margin-top: 4px; letter-spacing: 0.08em; }
.string-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.string-chip {
  flex: 1; min-width: 58px; text-align: center;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 4px; padding: 6px 4px;
  font-size: 0.62rem; letter-spacing: 0.08em; color: var(--dim);
}
.string-chip b { display: block; color: var(--text); font-size: 0.8rem; font-weight: normal; }
.string-chip.hit { border-color: var(--darkgas-teal); color: var(--darkgas-teal); }
.string-chip.hit b { color: var(--darkgas-teal); }

/* ── NOISE / HISS TOOLS ── */
.noise-section {
  width: 100%; max-width: 560px; margin: 0 auto 12px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 14px;
}
.noise-title { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
.noise-title em { color: var(--darkgas-teal); font-style: normal; }
.noise-tool { padding: 9px 0; border-top: 1px solid var(--border); }
.noise-tool:first-of-type { border-top: none; padding-top: 2px; }
.noise-tool-head { display: flex; align-items: center; gap: 10px; }
.noise-tool-head .noise-btn { flex-shrink: 0; }
.noise-tool-desc { font-size: 0.57rem; color: var(--dim); letter-spacing: 0.05em; line-height: 1.4; }
.noise-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--dim); cursor: pointer; transition: all 0.12s;
  white-space: nowrap; min-width: 92px;
}
.noise-btn.active { background: var(--darkgas-teal); color: #fff; border-color: var(--darkgas-teal); box-shadow: 0 0 10px var(--glow); }
.noise-param { display: none; margin-top: 8px; }
.noise-param.on { display: block; }
.noise-param .ctrl-label { margin-bottom: 4px; }

/* ── SPECTRUM TAB (ported from Overtone Scope) ── */
.scope-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.sc-btn {
  background: var(--panel-2); color: var(--dim); border: 1px solid var(--border);
  border-radius: 3px; padding: 6px 11px;
  font-family: 'Share Tech Mono', monospace; font-size: 0.63rem;
  letter-spacing: 0.08em; cursor: pointer; transition: all 0.12s;
}
.sc-btn[aria-pressed="true"] { background: #16323a; border-color: var(--darkgas-teal); color: var(--darkgas-teal); }
.sc-btn:hover { border-color: var(--darkgas-teal); }
.scope-frame {
  position: relative; display: flex; background: #000;
  border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
}
#sxAxis { flex: 0 0 46px; background: #05070a; display: block; width: 46px !important; }
.sx-plot { position: relative; flex: 1; min-width: 0; }
#sxSpec, #sxOver { display: block; width: 100% !important; height: 320px; }
#sxOver { position: absolute; inset: 0; }
.ladder { position: absolute; top: 0; right: 0; bottom: 0; width: 112px; pointer-events: none; }
.chip {
  position: absolute; right: 6px; transform: translateY(-50%); pointer-events: auto;
  font-family: 'Share Tech Mono', monospace; font-size: 0.6rem;
  padding: 2px 7px; border: 1px solid #33404f; border-radius: 2px;
  background: rgba(9,12,17,0.82); color: #dfe6ef; cursor: pointer;
  white-space: nowrap; transition: opacity 0.12s;
}
.chip[data-state="muted"] { border-color: #ff5a5a; color: #ff8b8b; text-decoration: line-through; }
.chip[data-state="solo"]  { border-color: var(--darkgas-teal); color: var(--darkgas-teal); }
.sx-readout {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  margin-top: 10px; font-size: 0.63rem; color: var(--dim); letter-spacing: 0.06em;
}
.sx-readout b { color: var(--text); font-weight: normal; }
.sx-readout .big { font-size: 1.15rem; letter-spacing: 0.04em; color: var(--darkgas-teal); }
.ramp { width: 110px; height: 9px; border: 1px solid var(--border);
  background: linear-gradient(90deg,#000512,#0b1e6b,#0b7fd4,#22c1a8,#c8e34a,#f5a623,#ff2d2d); }
.keys { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.keys button { padding: 6px 8px; min-width: 42px; }
.hint { color: var(--dim); font-size: 0.6rem; margin-top: 10px; line-height: 1.65; letter-spacing: 0.04em; }

/* ── MOBILE ── */
@media (max-width: 560px) {
  body { padding: calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
                  16px calc(12px + env(safe-area-inset-left));
         padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  .controls-grid { grid-template-columns: 1fr; }
  .meters, .trim-row { grid-template-columns: 1fr; }
  input[type=range] { height: 22px; }
  .audio-btn, .noise-btn, .scope-btn, .fft-btn, .freq-btn, .preset-load, .preset-del, .sc-btn, .sw3 button { min-height: 34px; }
  .freq-btn { padding: 7px 0; }
  header p { font-size: 0.6rem; letter-spacing: 0.1em; }
  .tuner-note { font-size: 3rem; }
  .legend { gap: 8px 14px; }
  #sxSpec, #sxOver { height: 260px; }
  .ladder { width: 94px; }
  .tip-bub { width: 190px; }
  .tab-btn { font-size: 0.5rem; }
  .dt-semis { font-size: 2.6rem; }
  .speed-sel button { min-height: 30px; }
}
@media (hover: none) and (pointer: coarse) {
  input[type=range] { height: 26px; }
}

/* ── Morley wah expression pad ───────────────────────────── */
/* touch-action flips to none only while engaged, so an idle pad still
   scrolls the page — engaging is a deliberate tap. */
.wah-pad {
  position: relative; width: 100%; height: 230px; margin-bottom: 8px;
  border: 1px solid var(--pedal-edge); border-radius: 8px;
  background: var(--panel-2); cursor: crosshair; overflow: hidden;
  touch-action: pan-y;
}
.wah-pad.engaged {
  border-color: var(--darkgas-teal);
  box-shadow: inset 0 0 0 1px var(--darkgas-teal), 0 0 18px var(--glow);
  touch-action: none;
}
.wah-dot {
  position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%;
  background: var(--darkgas-teal); box-shadow: 0 0 14px var(--glow);
  pointer-events: none;
}
.wah-pad:not(.engaged) .wah-dot { opacity: 0.3; }
.wah-axis {
  position: absolute; font-size: 0.5rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--dim); pointer-events: none;
}
.wah-toe   { top: 7px;    left: 50%; transform: translateX(-50%); }
.wah-heel  { bottom: 7px; left: 50%; transform: translateX(-50%); }
.wah-left  { left: 8px;   top: 50%;  transform: translateY(-50%); }
.wah-right { right: 8px;  top: 50%;  transform: translateY(-50%); }
.wah-left, .wah-right { display: none; }
.wah-pad.xfuzz .wah-left, .wah-pad.xfuzz .wah-right { display: block; }
.wah-hint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dim); pointer-events: none;
}
.wah-pad.engaged .wah-hint { display: none; }


/* Desktop uses the width: Output | EQ | Drive. Below 900px it stays one
   column in DOM order, which puts the EQ first where it belongs on a phone. */
.geq-layout { display: block; }
.geq-col { min-width: 0; }
@media (min-width: 900px) {
  .geq-layout {
    display: grid; align-items: start; gap: 18px;
    grid-template-columns: minmax(150px, 0.85fr) minmax(360px, 2.4fr) minmax(165px, 0.95fr);
  }
  .geq-col-left  { order: 1; }
  .geq-col-main  { order: 2; }
  .geq-col-right { order: 3; }
  .geq-col .noise-section { margin-bottom: 0; }
  .geq-col-right .geq-switch-row { gap: 16px; }
}

.geq-switch-row { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }

/* ── Graphic EQ preamp ───────────────────────────────────── */
/* touch-action: pan-y on the tracks is load-bearing: eleven vertical faders
   is the worst case for the scroll bug this app hit three times, so a fader
   only ever takes a horizontal touch drag. */
.geq-panel {
  border: 1px solid var(--pedal-edge); border-radius: 10px;
  background: var(--panel); padding: 12px 8px 10px; margin-bottom: 8px;
}
.geq-strip { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; align-items: end; }
.geq-band { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.geq-val {
  font-size: 0.46rem; color: var(--darkgas-teal);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.geq-track {
  position: relative; width: 100%; max-width: 26px; height: 132px;
  border: 1px solid var(--pedal-edge); border-radius: 4px; background: var(--panel-2);
  cursor: ns-resize; touch-action: pan-y;
}
.geq-track:focus-visible { outline: 2px solid var(--darkgas-teal); outline-offset: 2px; }
.geq-mid { position: absolute; left: 2px; right: 2px; bottom: 50%; height: 1px; background: var(--pedal-edge); }
.geq-fill {
  position: absolute; left: 3px; right: 3px; bottom: 50%; height: 0;
  background: var(--darkgas-teal); opacity: 0.45; border-radius: 1px;
}
.geq-knob {
  position: absolute; left: -1px; right: -1px; height: 10px; bottom: calc(50% - 5px);
  background: var(--text); border-radius: 2px; box-shadow: 0 0 6px var(--glow);
}
.geq-user .geq-track { border-color: var(--darkgas-teal); }
.geq-freq { font-size: 0.44rem; color: var(--dim); white-space: nowrap; }
.geq-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.geq-freq-input {
  width: 62px; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px;
  font-family: 'Share Tech Mono', monospace; font-size: 0.6rem;
}
.geq-freq-input:focus { outline: none; border-color: var(--darkgas-teal); }

/* ═══════════════════════════════════════════════════════════
   SKINS — three alternate looks, each with a light and dark mode.
   Append this at the END of the <style> block in parts/01_head.html.

   Axes:  html[data-skin="classic|aria|minimal|lab"]
          html[data-theme="dark|light"]

   Every skin only reassigns the existing variables, so nothing
   downstream needs to change. The bare :root and :root[data-theme]
   rules already in the file remain the Classic skin's values —
   these blocks override them when a skin is selected.

   Source order matters: each skin's dark block is followed by its
   light block, so the more specific light selector always wins.
   ═══════════════════════════════════════════════════════════ */

/* the body glow washes were hardcoded teal — make them skinnable */
:root { --wash-a: rgba(0,200,180,0.05); --wash-b: rgba(0,229,255,0.04); }
body {
  background-image:
    radial-gradient(ellipse 70% 50% at 15% 5%,  var(--wash-a) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 95%, var(--wash-b) 0%, transparent 60%);
}

/* ─────────────────────────────────────────────
   ARIA — glossy black, gold, oxblood
   ───────────────────────────────────────────── */
:root[data-skin="aria"] {
  --bg: #0a0a0b;
  --panel: #0d0d0f;
  --panel-2: #141315;
  --border: #2a2620;
  --bass: #e8c96a;
  --guitar: #e0384a;
  --kick: #d98324;
  --snare: #cfc4ae;
  --hh: #8f9668;
  --text: #efe9dc;
  --dim: #8a8378;
  --pedal-edge: #3a352a;
  --darkgas-teal: #c9a227;   /* accent slot: antique gold */
  --glow: rgba(201,162,39,0.35);
  --island: rgba(10,10,11,0.94);
  --wash-a: rgba(201,162,39,0.06);
  --wash-b: rgba(224,56,74,0.04);
  color-scheme: dark;
}
:root[data-skin="aria"][data-theme="light"] {
  --bg: #f2efe8;
  --panel: #faf8f2;
  --panel-2: #eae5d9;
  --border: #d8d0bd;
  --bass: #8f6f0e;
  --guitar: #a8121f;
  --kick: #a86a12;
  --snare: #6b5f45;
  --hh: #4f6b3a;
  --text: #1a1713;
  --dim: #7a7368;
  --pedal-edge: #c7bda6;
  --darkgas-teal: #8f6f0e;
  --glow: rgba(143,111,14,0.22);
  --island: rgba(250,248,242,0.94);
  --wash-a: rgba(143,111,14,0.05);
  --wash-b: rgba(168,18,31,0.04);
  color-scheme: light;
}
/* glossy black plastic: gold ring, red centre jewel */
:root[data-skin="aria"] .knob {
  border: 2px solid var(--darkgas-teal);
  background: radial-gradient(circle at 34% 26%, #3a3733 0%, #131211 46%, #050505 100%);
  box-shadow: 0 3px 10px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.14);
}
:root[data-skin="aria"] .knob-hub { background: var(--guitar); width: 7px; height: 7px; }
:root[data-skin="aria"][data-theme="light"] .knob {
  background: radial-gradient(circle at 34% 26%, #ffffff 0%, #e8e2d3 52%, #cfc6ae 100%);
  box-shadow: 0 2px 6px rgba(0,0,0,0.14), inset 0 1px 2px rgba(255,255,255,0.7);
}
:root[data-skin="aria"] .pedal-panel {
  background:
